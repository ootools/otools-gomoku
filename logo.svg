<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="五子棋">
  <defs>
    <linearGradient id="gomoku-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3140"/>
      <stop offset="100%" stop-color="#14171e"/>
    </linearGradient>
    <radialGradient id="gomoku-stone-b" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#707a8c"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </radialGradient>
    <radialGradient id="gomoku-stone-w" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c2c9d6"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#gomoku-bg)"/>
  <!-- 棋盘网格 5×5 -->
  <g stroke="#9aa6bd" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="24" x2="24" y2="104"/>
    <line x1="44" y1="24" x2="44" y2="104"/>
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="84" y1="24" x2="84" y2="104"/>
    <line x1="104" y1="24" x2="104" y2="104"/>
    <line x1="24" y1="24" x2="104" y2="24"/>
    <line x1="24" y1="44" x2="104" y2="44"/>
    <line x1="24" y1="64" x2="104" y2="64"/>
    <line x1="24" y1="84" x2="104" y2="84"/>
    <line x1="24" y1="104" x2="104" y2="104"/>
  </g>
  <!-- 天元与星位 -->
  <g fill="#9aa6bd" fill-opacity="0.85">
    <circle cx="64" cy="64" r="2.6"/>
    <circle cx="44" cy="44" r="2"/>
    <circle cx="84" cy="44" r="2"/>
    <circle cx="44" cy="84" r="2"/>
    <circle cx="84" cy="84" r="2"/>
  </g>
  <!-- 白子 -->
  <circle cx="44" cy="44" r="10" fill="url(#gomoku-stone-w)"/>
  <circle cx="84" cy="44" r="10" fill="url(#gomoku-stone-w)"/>
  <circle cx="64" cy="84" r="10" fill="url(#gomoku-stone-w)"/>
  <circle cx="104" cy="84" r="10" fill="url(#gomoku-stone-w)"/>
  <!-- 黑五连 -->
  <circle cx="24" cy="64" r="10" fill="url(#gomoku-stone-b)"/>
  <circle cx="44" cy="64" r="10" fill="url(#gomoku-stone-b)"/>
  <circle cx="64" cy="64" r="10" fill="url(#gomoku-stone-b)"/>
  <circle cx="84" cy="64" r="10" fill="url(#gomoku-stone-b)"/>
  <circle cx="104" cy="64" r="10" fill="url(#gomoku-stone-b)"/>
  <!-- 五连高亮 -->
  <line x1="22" y1="64" x2="106" y2="64" stroke="#f0b64a" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
</svg>
